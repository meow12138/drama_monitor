<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海外短剧爆款监控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rank-hot { color: #ef4444; }
        .rank-rising { color: #f59e0b; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">海外短剧爆款监控</h1>
                    <p class="text-sm text-gray-500 mt-1">实时监控 DramaBox、ReelShort、ShortMax 等六大平台榜单</p>
                </div>
                <div class="flex items-center gap-4">
                    <button
                        id="btn-trigger-fetch"
                        onclick="triggerFetch()"
                        class="bg-amber-500 hover:bg-amber-600 disabled:bg-amber-300 disabled:cursor-not-allowed text-white px-4 py-2 rounded-md text-sm font-medium transition-colors flex items-center gap-2"
                    >
                        <span id="trigger-fetch-icon">&#9889;</span>
                        <span id="trigger-fetch-text">立即抓取</span>
                    </button>
                    <div class="text-sm text-gray-500">
                        下次更新: <span id="countdown" class="font-mono font-medium text-blue-600">--:--</span>
                    </div>
                    <div id="status-indicator" class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500"></span>
                        <span class="text-sm text-gray-600">运行中</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
            <div class="flex flex-wrap items-end gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">平台</label>
                    <select id="filter-platform" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-40">
                        <option value="">全部平台</option>
                        <option value="dramabox">DramaBox</option>
                        <option value="reelshort">ReelShort</option>
                        <option value="shortmax">ShortMax</option>
                        <option value="flextv">FlexTV</option>
                        <option value="serealplus">Sereal+</option>
                        <option value="netshort">NetShort</option>
                        <option value="melolo">Melolo</option>
                        <option value="goodshort">GoodShort</option>
                        <option value="moboreels">MoboReels</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">榜单类型</label>
                    <select id="filter-rank-type" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-32">
                        <option value="hot">近期热剧榜</option>
                        <option value="rising">新剧飙升榜</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">时间周期</label>
                    <select id="filter-time-period" class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-32">
                        <option value="today">今日</option>
                        <option value="week">本周</option>
                        <option value="month">本月</option>
                    </select>
                </div>
                <div class="flex gap-2 ml-auto">
                    <button onclick="loadData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors flex items-center gap-2">
                        <span id="refresh-icon">&#x21bb;</span>
                        刷新
                    </button>
                    <button onclick="exportCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors flex items-center gap-2">
                        <span>&#x2193;</span>
                        导出CSV
                    </button>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-100 text-gray-700 font-medium">
                        <tr>
                            <th class="px-4 py-3 w-16">排名</th>
                            <th class="px-4 py-3">短剧名称</th>
                            <th class="px-4 py-3">平台</th>
                            <th class="px-4 py-3">标签</th>
                            <th class="px-4 py-3 w-24">评分</th>
                            <th id="th-play-num" class="px-4 py-3 w-24">播放量</th>
                            <th id="th-collect-num" class="px-4 py-3 w-24">收藏量</th>
                            <th class="px-4 py-3">链接</th>
                            <th class="px-4 py-3 w-40">更新时间</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body">
                        <tr>
                            <td colspan="9" class="px-4 py-12 text-center text-gray-400">
                                <div class="loading mb-2"></div>
                                正在加载数据...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination -->
            <div class="px-4 py-3 bg-gray-50 border-t flex items-center justify-between">
                <div class="text-sm text-gray-500">
                    共 <span id="total-count" class="font-medium">0</span> 条
                </div>
                <div class="flex gap-2">
                    <button onclick="prevPage()" id="btn-prev" class="px-3 py-1 border rounded text-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">上一页</button>
                    <span id="page-info" class="px-3 py-1 text-sm text-gray-600">第 1 页</span>
                    <button onclick="nextPage()" id="btn-next" class="px-3 py-1 border rounded text-sm hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">下一页</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center text-xs text-gray-400">
            海外短剧爆款监控系统 | 每3分钟自动更新 | 数据仅供参考
        </div>
    </div>

    <script>
        let currentOffset = 0;
        let currentLimit = 50;
        let currentTotal = 0;
        let countdownInterval = null;
        let autoRefreshInterval = null;
        let isTriggeringFetch = false;
        let triggerButtonResetTimer = null;
        const FETCH_INTERVAL = 3 * 60; // 3 minutes in seconds

        // Platform name mapping
        const PLATFORM_NAMES = {
            'dramabox': 'DramaBox',
            'reelshort': 'ReelShort',
            'shortmax': 'ShortMax',
            'flextv': 'FlexTV',
            'serealplus': 'Sereal+',
            'netshort': 'NetShort',
            'melolo': 'Melolo',
            'goodshort': 'GoodShort',
            'moboreels': 'MoboReels',
        };

        function setStatusIndicator(text = '运行中', dotClass = 'bg-green-500') {
            const indicator = document.getElementById('status-indicator');
            indicator.innerHTML = `
                <span class="w-2 h-2 rounded-full ${dotClass}"></span>
                <span class="text-sm text-gray-600">${text}</span>
            `;
        }

        function setTriggerButtonState({ disabled = false, label = '立即抓取', icon = '&#9889;' }) {
            const button = document.getElementById('btn-trigger-fetch');
            const iconEl = document.getElementById('trigger-fetch-icon');
            const textEl = document.getElementById('trigger-fetch-text');
            button.disabled = disabled;
            iconEl.innerHTML = icon;
            textEl.textContent = label;
        }

        function getFilters() {
            return {
                platform: document.getElementById('filter-platform').value,
                rank_type: document.getElementById('filter-rank-type').value,
                time_period: document.getElementById('filter-time-period').value,
            };
        }

        async function triggerFetch() {
            if (isTriggeringFetch) return;

            isTriggeringFetch = true;
            if (triggerButtonResetTimer) clearTimeout(triggerButtonResetTimer);

            setTriggerButtonState({
                disabled: true,
                label: '抓取中...',
                icon: '<span class="loading block" style="width: 14px; height: 14px; border-width: 2px; border-color: rgba(255,255,255,0.35); border-top-color: #ffffff;"></span>',
            });
            setStatusIndicator('抓取中', 'bg-amber-500');

            try {
                const res = await fetch('/api/trigger', { method: 'POST' });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || '立即抓取失败');
                }

                await loadData();
                setTriggerButtonState({
                    disabled: false,
                    label: `已抓取 ${data.fetched_items} 条`,
                    icon: '&#10003;',
                });
            } catch (err) {
                console.error('Trigger fetch failed:', err);
                setTriggerButtonState({
                    disabled: false,
                    label: '抓取失败',
                    icon: '&#33;',
                });
            } finally {
                isTriggeringFetch = false;
                setStatusIndicator('运行中', 'bg-green-500');
                triggerButtonResetTimer = setTimeout(() => {
                    setTriggerButtonState({});
                }, 2500);
            }
        }

        async function loadData() {
            const filters = getFilters();
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-12 text-center text-gray-400"><div class="loading mb-2"></div>正在加载数据...</td></tr>`;

            try {
                const params = new URLSearchParams({
                    limit: currentLimit,
                    offset: currentOffset,
                    ...filters,
                });
                const res = await fetch(`/api/rankings?${params}`);
                const data = await res.json();

                currentTotal = data.total;
                document.getElementById('total-count').textContent = currentTotal;
                updatePagination();
                renderTable(data.items);
                loadStats();
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="9" class="px-4 py-8 text-center text-red-500">加载失败: ${err.message}</td></tr>`;
            }
        }

        function formatMetric(value) {
            if (value === null || value === undefined) return '<span class="text-gray-300">—</span>';
            const num = Number(value);
            if (!Number.isFinite(num) || num <= 0) return '<span class="text-gray-300">—</span>';
            if (num >= 1_000_000) return (num / 1_000_000).toFixed(num >= 10_000_000 ? 1 : 2).replace(/\.?0+$/, '') + 'M';
            if (num >= 1_000) return (num / 1_000).toFixed(num >= 10_000 ? 1 : 2).replace(/\.?0+$/, '') + 'K';
            return String(num);
        }

        // FlexTV 没有播放量，play_num 存的是点赞数；全部平台时 FlexTV 的播放量列显示空
        // 这些平台的 play_num 存的是点赞量，不是播放量
        const LIKE_PLATFORMS = new Set(['flextv', 'serealplus', 'netshort']);

        function formatPlayNum(item) {
            const selectedPlatform = document.getElementById('filter-platform').value;
            // 全部平台时，点赞量平台的该列显示空（避免和播放量混淆）
            if (!selectedPlatform && LIKE_PLATFORMS.has(item.platform)) {
                return '<span class="text-gray-300">—</span>';
            }
            return formatMetric(item.play_num);
        }

        function updatePlayNumHeader() {
            const platform = document.getElementById('filter-platform').value;
            const thPlay = document.getElementById('th-play-num');
            const thCollect = document.getElementById('th-collect-num');
            // Melolo 没有播放量/收藏量，隐藏这两列
            if (platform === 'melolo') {
                thPlay.style.display = 'none';
                thCollect.style.display = 'none';
            } else {
                thPlay.style.display = '';
                thCollect.style.display = '';
                if (platform === 'flextv') {
                    thPlay.textContent = '点赞数';
                } else if (platform === 'serealplus' || platform === 'netshort') {
                    thPlay.textContent = '点赞量';
                } else {
                    thPlay.textContent = '播放量';
                }
            }
        }

        function renderTable(items) {
            const tbody = document.getElementById('data-table-body');
            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="px-4 py-8 text-center text-gray-400">暂无数据</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map((item, idx) => `
                <tr class="border-b hover:bg-gray-50 fade-in" style="animation-delay: ${idx * 0.03}s">
                    <td class="px-4 py-3">
                        <span class="inline-flex items-center justify-center w-8 h-8 rounded-full text-sm font-bold ${item.rank_position <= 3 ? 'bg-red-100 text-red-600' : 'bg-gray-100 text-gray-600'}">
                            ${item.rank_position}
                        </span>
                    </td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-3">
                            ${item.cover_url ? `<img src="${item.cover_url}" class="w-10 h-14 object-cover rounded" alt="">` : '<div class="w-10 h-14 bg-gray-200 rounded flex items-center justify-center text-xs text-gray-400">无图</div>'}
                            <div>
                                <div class="font-medium text-gray-900">${escapeHtml(item.drama_name)}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-4 py-3">
                        <span class="inline-block px-2 py-1 rounded text-xs font-medium bg-blue-50 text-blue-700">
                            ${PLATFORM_NAMES[item.platform] || item.platform}
                        </span>
                    </td>
                    <td class="px-4 py-3">
                        ${item.tags ? item.tags.split(',').map(t => `<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-600 mr-1">${escapeHtml(t.trim())}</span>`).join('') : '-'}
                    </td>
                    <td class="px-4 py-3">
                        ${item.score !== null && item.score !== undefined
                            ? `<span class="font-bold ${item.score >= 8 ? 'text-red-500' : item.score >= 6 ? 'text-yellow-500' : 'text-gray-500'}">${item.score.toFixed(1)}</span>`
                            : '-'}
                    </td>
                    <td class="px-4 py-3 text-sm font-medium text-gray-700" data-col="play">${formatPlayNum(item)}</td>
                    <td class="px-4 py-3 text-sm font-medium text-gray-700" data-col="collect">${formatMetric(item.collect_num)}</td>
                    <td class="px-4 py-3">
                        ${item.link
                            ? `<a href="${item.link}" target="_blank" class="text-blue-600 hover:underline text-xs">查看 &rarr;</a>`
                            : '-'}
                    </td>
                    <td class="px-4 py-3 text-xs text-gray-500">
                        ${item.updated_at ? new Date(item.updated_at).toLocaleString('zh-CN') : '-'}
                    </td>
                </tr>
            `).join('');

            // 同步列可见性：Melolo 时隐藏播放量/收藏量列的 td
            const platform = document.getElementById('filter-platform').value;
            const hideCols = platform === 'melolo';
            document.querySelectorAll('td[data-col="play"], td[data-col="collect"]').forEach(td => {
                td.style.display = hideCols ? 'none' : '';
            });
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const stats = await res.json();
                const container = document.getElementById('stats-bar');

                // Aggregate by platform
                const platformStats = {};
                stats.forEach(s => {
                    if (!platformStats[s.platform]) {
                        platformStats[s.platform] = { count: 0, last_updated: s.last_updated };
                    }
                    platformStats[s.platform].count += s.count;
                });

                container.innerHTML = Object.entries(platformStats).map(([key, stat]) => `
                    <div class="bg-white rounded-lg shadow-sm p-4">
                        <div class="text-xs text-gray-500 mb-1">${PLATFORM_NAMES[key] || key}</div>
                        <div class="text-2xl font-bold text-gray-900">${stat.count}</div>
                        <div class="text-xs text-gray-400 mt-1">${stat.last_updated ? new Date(stat.last_updated).toLocaleDateString('zh-CN') : ''}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Stats load failed:', e);
            }
        }

        function updatePagination() {
            const totalPages = Math.ceil(currentTotal / currentLimit);
            const currentPage = Math.floor(currentOffset / currentLimit) + 1;
            document.getElementById('page-info').textContent = `第 ${currentPage} 页 / 共 ${totalPages || 1} 页`;
            document.getElementById('btn-prev').disabled = currentOffset <= 0;
            document.getElementById('btn-next').disabled = currentOffset + currentLimit >= currentTotal;
        }

        function prevPage() {
            if (currentOffset >= currentLimit) {
                currentOffset -= currentLimit;
                loadData();
            }
        }

        function nextPage() {
            if (currentOffset + currentLimit < currentTotal) {
                currentOffset += currentLimit;
                loadData();
            }
        }

        function exportCSV() {
            const filters = getFilters();
            const params = new URLSearchParams(filters);
            window.open(`/api/export/csv?${params}`, '_blank');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function startCountdown() {
            let remaining = FETCH_INTERVAL;
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    remaining = FETCH_INTERVAL;
                    loadData();
                }
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                document.getElementById('countdown').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }, 1000);
        }

        // Event listeners
        document.getElementById('filter-platform').addEventListener('change', () => {
            currentOffset = 0;
            updatePlayNumHeader();
            loadData();
        });
        document.getElementById('filter-rank-type').addEventListener('change', () => { currentOffset = 0; loadData(); });
        document.getElementById('filter-time-period').addEventListener('change', () => { currentOffset = 0; loadData(); });

        // Init
        updatePlayNumHeader();
        loadData();
        startCountdown();
    </script>
</body>
</html>
